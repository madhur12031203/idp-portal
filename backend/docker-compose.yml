services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: idp_portal
      POSTGRES_USER: idp
      POSTGRES_PASSWORD: idp
    ports:
      - "5432:5432"
    volumes:
      - idp-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U idp -d idp_portal"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://idp:idp@postgres:5432/idp_portal
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             python -m app.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"


  adminer:
    image: adminer:latest
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  idp-postgres:

